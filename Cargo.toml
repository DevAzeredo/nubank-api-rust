[package]
name = "api_nubank"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.3.1"
reqwest =   { version = "0.11.18",  features = ["json", "native-tls"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
openssl = { version = "0.10.35", features = ["vendored"] }
openssl-sys = { version =  "0.9.88", features = ["vendored"] } 
lazy_static = "1.4.0"
rand = "0.8.5"
once_cell = "1.18.0"
regex = "1.8.4"
surrealdb = { version =  "1.0.0-beta.9", features = ["kv-rocksdb"] } 
log = "0.4.19"
env_logger = "0.10.0"
anyhow = "1.0.75"
   